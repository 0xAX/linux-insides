    <path class="ln" d="M 510 225 L 550 225" marker-end="url(#arrow)"/>
    <rect class="used" x="360" y="255" width="150" height="40"/>
    <path class="ln" d="M 320 275 L 360 275" marker-end="url(#arrow)"/>
    <rect class="box" x="550" y="250" width="250" height="50"/>
    <path class="ln" d="M 510 275 L 550 275" marker-end="url(#arrow)"/>
    <rect class="box" x="20" y="255" width="130" height="80"/>
    <rect class="used" x="20" y="335" width="130" height="30"/>
    <path class="ln" d="M 150 350 L 255 350 L 255 300" marker-end="url(#arrow)"/>
