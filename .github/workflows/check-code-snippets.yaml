name: check code snippets

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_code_snippets.py'
      - 'scripts/pyproject.toml'
      - 'scripts/uv.lock'
      - '.github/workflows/check-code-snippets.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-code-snippets:
    name: check-code-snippets
    runs-on:
      - ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock
      - name: Validate code snippets
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_API_TOKEN }}
        run: |
          uv run --project scripts --locked ./scripts/check_code_snippets.py .
