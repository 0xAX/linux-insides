<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Linux insides - a book-in-progress about the Linux kernel and its insides">
  <title>Linux insides</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcc624" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fcc624" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#panel)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- privilege rings: user space on the outside, ring 0 at the core -->
  <circle cx="975" cy="160" r="150" fill="url(#glow)"/>
  <circle cx="975" cy="160" r="112" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 7"/>
  <circle cx="975" cy="160" r="92" fill="none" stroke="#373e47" stroke-width="1.5"/>
  <circle cx="975" cy="160" r="64" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="975" cy="160" r="38" fill="#fcc624" fill-opacity="0.1" stroke="#fcc624" stroke-width="1.5"/>
  <text x="975" y="36" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#6e7681" letter-spacing="1.5">user space</text>
  <text x="975" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#fcc624" letter-spacing="0.5">ring 0</text>

  <line x1="820" y1="64" x2="820" y2="256" stroke="#21262d" stroke-width="1.5"/>

  <text x="72" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="56" font-weight="bold" fill="#e6edf3">Linux insides</text>
  <rect x="72" y="172" width="104" height="4" rx="2" fill="#fcc624"/>
  <text x="72" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#8b949e">A book-in-progress about the Linux kernel and its insides.</text>
  <text x="72" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#39424e">000001f0  00 00 00 00 00 00 00 00  00 00 00 00 00 00 55 aa</text>
</svg>
